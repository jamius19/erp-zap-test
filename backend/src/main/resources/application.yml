spring:
  application:
    name: erp-zap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8088
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    # HMAC-SHA256 secret, base64, >= 32 bytes. Override in any real deployment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1wbGVhc2UtMzItYnl0ZXMtbWluIQ==}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  refresh-cookie:
    name: refresh_token
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: http://localhost:5173
  upload-dir: ${UPLOAD_DIR:./uploads}
  seed:
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
